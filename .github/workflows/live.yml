name: Continuous Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg & yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          sudo pip3 install --upgrade yt-dlp

      - name: Start Stream
        run: |
          yt-dlp -g -f "best[ext=mp4]/best" "https://youtu.be/HclbhIm6tZU?si=Oxxk0KowLa9UH-vJ" | {
            read VIDEO_URL
            ffmpeg -re -stream_loop -1 -i "$VIDEO_URL" \
              -c:v libx264 -preset ultrafast -b:v 2500k -maxrate 2500k -bufsize 5000k -g 50 \
              -c:a aac -b:a 128k -ar 44100 \
              -f flv "rtmp://a.rtmp.youtube.com/live2/b2fx-28zj-rs4u-6wsa-79k8"
          }
