name: Ultimate Live Stream Workflow

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct MP4 Link (Video file or background loop video)'
        required: true
        default: ''
      audio_url:
        description: 'Direct Audio Link (Leave "none" if file already has audio)'
        required: false
        default: 'none'
      loop_count:
        description: 'Loop Count for single video file (1 = Once, 10 = 10 times, -1 = Infinite). Ignored if audio_url is provided.'
        required: false
        default: '1'

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start Live Stream
        run: |
          AUDIO_INPUT="${{ github.event.inputs.audio_url }}"
          VIDEO_INPUT="${{ github.event.inputs.video_url }}"
          LOOP_VAL=${{ github.event.inputs.loop_count }}

          if [ "$AUDIO_INPUT" == "none" ] || [ -z "$AUDIO_INPUT" ]; then
            # SCENARIO 1: Single combined video file
            if [ "$LOOP_VAL" -eq -1 ]; then
              LOOP_ARG="-1"
            else
              LOOP_ARG=$((LOOP_VAL - 1))
            fi

            echo "Streaming single video file with loop argument: $LOOP_ARG"
            ffmpeg -re -stream_loop $LOOP_ARG -i "$VIDEO_INPUT" \
              -c:v libx264 -preset ultrafast -b:v 2500k -maxrate 2500k -bufsize 5000k -g 50 \
              -c:a aac -b:a 128k -ar 44100 \
              -f flv "rtmp://a.rtmp.youtube.com/live2/b2fx-28zj-rs4u-6wsa-79k8"
          else
            # SCENARIO 2: Separate Audio + Video (Video loops until audio ends)
            echo "Streaming short video loop with long audio track..."
            ffmpeg -re -stream_loop -1 -i "$VIDEO_INPUT" \
              -i "$AUDIO_INPUT" \
              -map 0:v:0 -map 1:a:0 \
              -c:v libx264 -preset ultrafast -b:v 2500k -maxrate 2500k -bufsize 5000k -g 50 \
              -c:a aac -b:a 128k -ar 44100 \
              -shortest \
              -f flv "rtmp://a.rtmp.youtube.com/live2/b2fx-28zj-rs4u-6wsa-79k8"
          fi
